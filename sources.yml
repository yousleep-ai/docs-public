# Which repositories contribute to this site, and which of their pages. A page
# becomes public by being listed here, so a change to this file is a
# publication decision.
#
# Keys per source:
#   name / repo / ref / docs / target   where the pages come from and where they land
#   include                             the pages copied, relative to `docs`
#   reference                           generate the API reference for this package

sources:
  - name: common
    repo: yousleep-ai/common
    ref: main
    docs: docs
    # Keeps the pages' relative links, to the generated reference in
    # particular, intact.
    target: components/common
    include:
      - index.md
      - sdk-guide.md
      - sdk-workflows.md
      - sdk-selectors.md
      - sdk-bulk-metadata.md
      - integration-guide.md
      - version-pairing.md
      - components.md
      - sleep-statistics.md
      - edf.md
      - analysis-manifest.md
      - events-document.md
      - analysis-authoring.md
      - init.md
      - conformance.md
    reference:
      package: yousleep_common
      display: Common

  # The runner, for the IT of a site that runs analyses on its own hardware.
  - name: runner
    repo: yousleep-ai/runner
    ref: main
    docs: docs
    target: components/runner
    include:
      - index.md
      - quickstart.md
      - site.md
      - storage.md
      - data-and-security.md
      - install.md
      - operate.md
