# Which repositories contribute to the public developer site, and exactly which
# of their pages. The private documentation site (yousleep-ai/docs) aggregates
# everything; this rendering aggregates an allowlist. A page becomes public by
# being listed here, so a change to this file is a publication decision.
#
# Built by yousleep-ai/docs's toolchain (build-site.yml); the keys are its:
#   name / repo / ref / docs / target   as there
#   include                             the pages copied, relative to `docs`
#   reference                           generate the API reference for this package

sources:
  - name: common
    repo: yousleep-ai/common
    ref: main
    docs: docs
    # Same path as on the internal site, so a page's relative links (to the
    # generated reference above all) resolve identically in both renderings.
    target: components/common
    include:
      - index.md
      - sdk-guide.md
      - sdk-workflows.md
      - sdk-selectors.md
      - sdk-bulk-metadata.md
      - integration-guide.md
      - version-pairing.md
      - components.md
      - analysis-manifest.md
      - events-document.md
      - analysis-authoring.md
      - conformance.md
    reference:
      package: yousleep_common
      display: Common
