name: PR Checks

# A pull request builds the site exactly as Publish does, strict, and stops there.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          path: overlay

      - name: Mint a token that can read the toolchain and the sources
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.YOUSLEEP_CI_BOT_APP_ID }}
          private-key: ${{ secrets.YOUSLEEP_CI_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: actions/checkout@v7
        with:
          repository: yousleep-ai/docs
          token: ${{ steps.app-token.outputs.token }}
          path: toolchain

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Build the site
        working-directory: toolchain
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: ./build_overlay.sh "$GITHUB_WORKSPACE/overlay"
