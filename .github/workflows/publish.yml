name: Publish

# The public developer site, built by the youSleep documentation toolchain
# (yousleep-ai/docs, checked out with a read-only token) from this
# repository's sources.yml, mkdocs.yml and docs/.
#
# Rebuilt on every push here and daily, so a documentation change in a source
# repository reaches the site without a change here.
on:
  push:
    branches: [main]
  schedule:
    - cron: "30 6 * * *"
  repository_dispatch:
    types: [source-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          path: overlay

      - name: Mint a token that can read the toolchain and the sources
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DOCS_READER_APP_ID }}
          private-key: ${{ secrets.DOCS_READER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: actions/checkout@v7
        with:
          repository: yousleep-ai/docs
          token: ${{ steps.app-token.outputs.token }}
          path: toolchain

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Build the site
        working-directory: toolchain
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: ./build_overlay.sh "$GITHUB_WORKSPACE/overlay"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: toolchain/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
